; Minimal inkkit example: brings the device layer up and draws a border.
; Built by CI for both Xteink targets. The x4 and x3 environments produce the
; same binary today (the vendored HAL detects the device at runtime); they are
; kept separate so each target ships a named .bin artifact.
[platformio]
default_envs = xteink_x4

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
lib_deps =
  file://../..

[env:xteink_x4]
extends = common

[env:xteink_x3]
extends = common

; Hardware-free build of the same example against the INKKIT_HAL_STUB layer;
; proves the stub keeps the full wrapper API compiling and linking.
[env:stub]
extends = common
build_flags =
  ${common.build_flags}
  -DINKKIT_HAL_STUB=1
